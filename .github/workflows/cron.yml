name: Prayer Times Publisher

# زمان‌بندی را cron-job.org انجام می‌دهد (هر ۱۰ دقیقه).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prayer-times-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Publish due posts
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHANNEL_ID }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          METHOD: ${{ vars.METHOD }}
          HIJRI_ADJUST: ${{ vars.HIJRI_ADJUST }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
        run: python main.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/published.json
          git diff --cached --quiet || git commit -m "Update published history"
          git push
